name: Actualizar lista de imágenes

on:
  push:
    branches:
      - main
      - master
    paths:
      - '*.png'
      - '*.PNG'
      - '*.jpg'
      - '*.JPG'
      - '*.jpeg'
      - '*.JPEG'
      - 'index.html'
      - 'imagenes.json'
      - '.github/workflows/generar-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generar imagenes.json
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          extensiones = {'.png', '.jpg', '.jpeg'}

          archivos = sorted(
              p.name
              for p in Path('.').iterdir()
              if p.is_file() and p.suffix.lower() in extensiones
          )

          Path('imagenes.json').write_text(
              json.dumps(archivos, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

          print(f'Imágenes encontradas: {len(archivos)}')
          for archivo in archivos:
              print(f' - {archivo}')
          PY

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add imagenes.json

          if git diff --cached --quiet; then
            echo "imagenes.json ya está actualizado."
          else
            git commit -m "Actualizar lista de imágenes"
            git push
          fi
