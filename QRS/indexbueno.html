<html lang="es">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todos tus QR...</title>
  <style>
    /* Fuentes personalizadas */
    @font-face {
      font-family: 'Love Storya';
      src: local('Love Storya'), local('LoveStorya');
    }

    @font-face {
      font-family: 'La Beauties';
      src: local('La Beauties'), local('LaBeauties');
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: url('318778.png') no-repeat center center fixed;
      background-size: cover;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 40px 20px;
    }

    /* Capa para oscurecer suavemente el fondo */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      overflow: hidden;
    }

    /* Título: entra suave por la izquierda */
    header h1 {
      font-family: 'Love Storya', 'Brush Script MT', cursive;
      font-size: 3.5rem;
      color: #ffffff;
      margin-bottom: 5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      font-weight: normal;
      opacity: 0;
      animation: slideInLeft 2.2s cubic-bezier(0.25, 1, 0.5, 1) 1.5s forwards;
    }

    /* Subtítulo: desplazado bastante más hacia la derecha */
    header p {
      font-family: 'La Beauties', 'Dancing Script', cursive;
      font-size: 1.5rem;
      color: #000000;
      display: block;
      margin-left: 280px; /* Desplazamiento marcado hacia la derecha */
      opacity: 0;
      animation: slideInRight 2.2s cubic-bezier(0.25, 1, 0.5, 1) 1.5s forwards;
      text-shadow: 
        -1px -1px 0 #ffffff,
         1px -1px 0 #ffffff,
        -1px  1px 0 #ffffff,
         1px  1px 0 #ffffff,
         0px  0px 12px rgba(255, 255, 255, 0.9),
         0px  0px 20px rgba(255, 255, 255, 0.7);
    }

    /* KEYFRAMES ENTRADA TEXTOS */
    @keyframes slideInLeft {
      0% {
        opacity: 0;
        transform: translateX(-200px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInRight {
      0% {
        opacity: 0;
        transform: translateX(200px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Grid principal: 3 columnas */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      padding: 20px 10px 60px 10px;
      justify-items: center;
      min-height: 800px;
    }

    @media (max-width: 900px) {
      header p {
        margin-left: 0; /* Centrado automático en móviles/tablets */
      }
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Estilo del marco Polaroid */
    .polaroid-card {
      background: #ffffff;
      padding: 15px 15px 20px 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 2px 5px rgba(0,0,0,0.2);
      border-radius: 4px;
      width: 100%;
      max-width: 310px;
      position: relative;
      opacity: 0;
      transform-origin: center center;
      transition: box-shadow 0.3s ease;
    }

    .polaroid-card:hover {
      z-index: 100 !important;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    /* Hover en estado repartido */
    .gallery-grid.dealt .polaroid-card {
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
    }

    .gallery-grid.dealt .polaroid-card:hover {
      transform: scale(1.06) rotate(0deg) !important;
    }

    .img-wrapper {
      width: 100%;
      height: 210px;
      overflow: hidden;
      background-color: #f0f0f0;
      border: 1px solid #eee;
      margin-bottom: 12px;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .caption {
      text-align: center;
      font-size: 0.95rem;
      color: #333;
      font-weight: 600;
      margin-bottom: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .download-btn {
      display: block;
      width: 100%;
      padding: 10px;
      background-color: #e50914;
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      border-radius: 4px;
      font-size: 0.9rem;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .download-btn:hover {
      background-color: #b20710;
    }

    .download-btn:active {
      transform: scale(0.98);
    }

    /* KEYFRAMES ANIMACIÓN POLAROID */
    @keyframes dropToStack {
      0% {
        opacity: 0;
        transform: translate(var(--center-x), -100vh) rotate(var(--random-stack-rot)) scale(1.1);
      }
      70% {
        opacity: 1;
        transform: translate(var(--center-x), calc(var(--center-y) + 15px)) rotate(var(--random-stack-rot)) scale(1);
      }
      100% {
        opacity: 1;
        transform: translate(var(--center-x), var(--center-y)) rotate(var(--random-stack-rot)) scale(1);
      }
    }

    @keyframes shuffleLeft {
      0% {
        transform: translate(var(--center-x), var(--center-y)) rotate(var(--random-stack-rot));
      }
      50% {
        transform: translate(calc(var(--center-x) - 150px), var(--center-y)) rotate(-15deg) scale(1.05);
      }
      100% {
        transform: translate(var(--center-x), var(--center-y)) rotate(var(--random-stack-rot));
      }
    }

    @keyframes shuffleRight {
      0% {
        transform: translate(var(--center-x), var(--center-y)) rotate(var(--random-stack-rot));
      }
      50% {
        transform: translate(calc(var(--center-x) + 150px), var(--center-y)) rotate(15deg) scale(1.05);
      }
      100% {
        transform: translate(var(--center-x), var(--center-y)) rotate(var(--random-stack-rot));
      }
    }

    .anim-drop {
      animation: dropToStack 0.85s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .anim-shuffle-left {
      animation: shuffleLeft 1.0s ease-in-out forwards;
    }

    .anim-shuffle-right {
      animation: shuffleRight 1.0s ease-in-out forwards;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Todos tus QR...</h1>
      <p>Descarga el que necesites</p>
    </header>

    <div class="gallery-grid" id="gallery">
      <!-- Las 15 tarjetas Polaroid -->
    </div>
  </div>

  <script>
    const images = [
      { src: '24hcontraseña.png', title: 'Atención 24H AVSPhone' },
      { src: 'citagestor.png', title: 'Pide Cita Gestor' },
      { src: 'citarrhh.png', title: 'Cita RRHH Presencial' },
      { src: 'citatelefonicaerica.png', title: 'Solicita Móvil de Empresa' },
      { src: 'cobrarfestivo.png', title: 'Festivo Trabajado' },
      { src: 'contraseñauberdrive.png', title: 'Acceso Uber Driver' },
      { src: 'geotabcontraseña.jpg', title: 'Acceso Geotab' },
      { src: 'appcaontraseñacolage.png', title: 'Collage Aplicaciones UGT' },
      { src: 'mapacargadores.png', title: 'Cargadores Zunder' },
      { src: 'moovefleet.jpg', title: 'MooveFleet Driver 5.0.1' },
      { src: 'moovefleetcontraseña.png', title: 'Contraseña MooveFleet' },
      { src: 'mutua.png', title: 'Acceso Mutua' },
      { src: 'pidefurgoqr.png', title: 'Conducir Furgoneta' },
      { src: 'trabaja.png', title: 'Únete a Moove Cars' },
      { src: 'trabajacampaqr.png', title: 'Labores de Base' },
      { src: 'TicketAeropuerto.png', title: 'Ticket Aeropuerto' }
    ];

    const galleryContainer = document.getElementById('gallery');
    let cards = [];

    function createGallery() {
      galleryContainer.innerHTML = '';
      cards = [];

      images.forEach((imgData, index) => {
        const card = document.createElement('div');
        card.className = 'polaroid-card';
        card.dataset.index = index;

        card.innerHTML = `
          <div class="img-wrapper">
            <img src="${imgData.src}" alt="${imgData.title}">
          </div>
          <div class="caption">${imgData.title}</div>
          <a href="${imgData.src}" download="${imgData.src}" class="download-btn">📥 Descargar</a>
        `;

        galleryContainer.appendChild(card);
        cards.push(card);
      });
    }

    function startCardSequence() {
      galleryContainer.classList.remove('dealt');
      
      const containerRect = galleryContainer.getBoundingClientRect();

      cards.forEach((card, i) => {
        card.className = 'polaroid-card';
        card.style.transition = 'none';
        card.style.opacity = '0';

        const cardRect = card.getBoundingClientRect();
        
        const centerX = (containerRect.width / 2) - (cardRect.width / 2) - (card.offsetLeft - galleryContainer.offsetLeft);
        const centerY = -10 - (card.offsetTop - galleryContainer.offsetTop);

        const randomStackRot = (Math.random() * 8 - 4).toFixed(1) + 'deg';
        const finalRot = (Math.random() * 10 - 5).toFixed(1) + 'deg';

        card.style.setProperty('--center-x', `${centerX}px`);
        card.style.setProperty('--center-y', `${centerY}px`);
        card.style.setProperty('--random-stack-rot', randomStackRot);
        card.style.setProperty('--final-rot', finalRot);
        card.style.zIndex = i + 1;
      });

      cards.forEach((card, i) => {
        setTimeout(() => {
          card.classList.add('anim-drop');
        }, i * 120);
      });

      const finishDropTime = (cards.length * 120) + 850;

      setTimeout(() => {
        cards.forEach((card, i) => {
          card.classList.remove('anim-drop');
          card.style.opacity = '1';
          card.style.transform = `translate(var(--center-x), var(--center-y)) rotate(var(--random-stack-rot))`;

          if (i % 2 === 0) {
            card.classList.add('anim-shuffle-left');
          } else {
            card.classList.add('anim-shuffle-right');
          }
        });
      }, finishDropTime);

      const finishShuffleTime = finishDropTime + 1100;

      setTimeout(() => {
        cards.forEach((card) => {
          card.classList.remove('anim-shuffle-left', 'anim-shuffle-right');
          card.style.transition = 'transform 1.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.8s ease';
          card.style.transform = `translate(0, 0) rotate(var(--final-rot))`;
          card.style.zIndex = 1;
        });

        setTimeout(() => {
          galleryContainer.classList.add('dealt');
        }, 1400);

      }, finishShuffleTime);
    }

    window.addEventListener('DOMContentLoaded', () => {
      createGallery();
      setTimeout(startCardSequence, 200);
    });
  </script>
