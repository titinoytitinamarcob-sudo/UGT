/* =====================================================
   EFECTO PASAR PÁGINA LIBRO
===================================================== */
#bookTurnOverlay {
  position: fixed;
  inset: 0;
  z-index: 999999;
  pointer-events: none;
  display: none;
  perspective: 2000px;
  perspective-origin: 0% 50%;
  background: rgba(245,245,247,0.3);
}
#bookTurnOverlay.active {
  display: block;
  pointer-events: auto;
}
#bookTurnOverlay .book-turn-page {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  background: linear-gradient(105deg, #ffffff 0%, #f8f8f8 100%);
  transform-origin: left center;
  transform-style: preserve-3d;
  will-change: transform;
  box-shadow: 0 0 0 rgba(0,0,0,0);
}
#bookTurnOverlay.active .book-turn-page {
  animation: bookPageTurn 1.15s cubic-bezier(0.645, 0.045, 0.355, 1) forwards;
}
#bookTurnOverlay .book-turn-page::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to right, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.04) 8%, transparent 25%, transparent 100%);
  opacity: 0;
  transition: opacity 0.3s;
}
#bookTurnOverlay.active .book-turn-page::before {
  animation: shadowFade 1.15s ease forwards;
}
#bookTurnOverlay .book-turn-page::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  width: 60px;
  height: 100%;
  background: linear-gradient(to left, rgba(0,0,0,0.15), transparent);
  opacity: 0;
}
#bookTurnOverlay.active .book-turn-page::after {
  animation: edgeShadow 1.15s ease forwards;
}
@keyframes bookPageTurn {
  0% {
    transform: perspective(2000px) rotateY(0deg) translateZ(0);
    box-shadow: 0 0 0 rgba(0,0,0,0);
  }
  20% {
    box-shadow: -10px 0 30px rgba(0,0,0,0.15), -2px 0 10px rgba(0,0,0,0.1);
  }
  100% {
    transform: perspective(2000px) rotateY(-165deg) translateZ(10px);
    box-shadow: -40px 10px 80px rgba(0,0,0,0.35), -10px 0 40px rgba(0,0,0,0.25);
  }
}
@keyframes shadowFade {
  0% { opacity: 0; }
  30% { opacity: 1; }
  100% { opacity: 0.6; }
}
@keyframes edgeShadow {
  0% { opacity: 0; }
  15% { opacity: 1; }
  100% { opacity: 0; }
}
/* Sombra del lomo del libro */
#bookTurnOverlay .book-spine-shadow {
  position: absolute;
  left: 0;
  top: 0;
  width: 40px;
  height: 100%;
  background: linear-gradient(to right, rgba(0,0,0,0.15), transparent);
  opacity: 0;
  pointer-events: none;
}
#bookTurnOverlay.active .book-spine-shadow {
  animation: spineIn 1.15s ease forwards;
}
@keyframes spineIn {
  0% { opacity: 0; transform: translateX(-20px); }
  40% { opacity: 1; transform: translateX(0); }
  100% { opacity: 0.3; }
}


/* =====================================================
   ANIMACIÓN FLUIDA - PASAR HOJA DESDE ESQUINA INFERIOR DERECHA
   Sin parones, solo transform GPU
===================================================== */
#fluidPageTurn {
  position: fixed;
  inset: 0;
  z-index: 9999999;
  display: none;
  perspective: 3200px;
  perspective-origin: 100% 100%;
  background: #ffffff;
  overflow: hidden;
  will-change: transform;
}
#fluidPageTurn.active {
  display: block;
}
#fluidPageTurn .fpt-under {
  position: absolute;
  inset: 0;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 18px;
  z-index: 1;
}
#fluidPageTurn .fpt-under .fpt-logo {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  object-fit: cover;
  background: #e60012;
  box-shadow: 0 10px 32px rgba(230,0,18,0.28), 0 0 0 4px #fff, 0 0 0 5px rgba(230,0,18,0.12);
  animation: fptLogoSpin 1s linear infinite;
  will-change: transform;
}
@keyframes fptLogoSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
#fluidPageTurn .fpt-under .fpt-text {
  font-family: 'Sora', system-ui, sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: #0A0A0A;
  opacity: 0.6;
}

#fluidPageTurn .fpt-wrap {
  position: absolute;
  inset: 0;
  z-index: 2;
  perspective: 3200px;
  perspective-origin: 100% 100%;
  transform-style: preserve-3d;
  will-change: transform;
}

#fluidPageTurn .fpt-page {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform-origin: 100% 100%;
  transform-style: preserve-3d;
  will-change: transform;
  /* Fuerza aceleración GPU */
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform: translateZ(0);
}

#fluidPageTurn .fpt-front,
#fluidPageTurn .fpt-back {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
  will-change: transform;
}

#fluidPageTurn .fpt-front {
  background: #ffffff;
  transform: rotateY(0deg);
  transform-origin: 100% 100%;
  z-index: 2;
}

#fluidPageTurn .fpt-front-inner {
  position: absolute;
  top: 0;
  left: 0;
  width: 100vw;
  min-height: 100vh;
  pointer-events: none;
  will-change: transform;
  /* Suavizado */
  -webkit-font-smoothing: antialiased;
}

#fluidPageTurn .fpt-back {
  background: #ffffff;
  transform: rotateY(180deg);
  transform-origin: 100% 100%;
  z-index: 1;
}

#fluidPageTurn .fpt-front::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent 55%, rgba(0,0,0,0.06) 78%, rgba(0,0,0,0.18) 92%);
  opacity: 0;
  pointer-events: none;
  z-index: 10;
  will-change: opacity;
}

/* Animación FLUIDA sin parones - solo transform */
#fluidPageTurn.active .fpt-page {
  animation: fluidPageTurnAnim 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  /* cubic-bezier material design para fluidez total */
}
#fluidPageTurn.active .fpt-front {
  animation: fluidShadow 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}
#fluidPageTurn.active .fpt-front::after {
  animation: fluidGradient 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

@keyframes fluidPageTurnAnim {
  0% {
    transform: perspective(3200px) rotateY(0deg) rotateZ(0deg) rotateX(0deg) translateZ(0px);
  }
  100% {
    transform: perspective(3200px) rotateY(-172deg) rotateZ(-10deg) rotateX(8deg) translateZ(80px);
  }
}

@keyframes fluidShadow {
  0% {
    box-shadow: 0 0 0 rgba(0,0,0,0);
    filter: brightness(1);
  }
  100% {
    box-shadow: -30px 10px 60px rgba(0,0,0,0.28), -12px 0 30px rgba(0,0,0,0.18);
    filter: brightness(0.94);
  }
}

@keyframes fluidGradient {
  0% { opacity: 0; }
  100% { opacity: 1; }
}

/* Hint visual en el botón - esquina doblada sutil */
.boton-delegado::before {
  content: "";
  position: absolute;
  bottom: 0;
  right: 0;
  width: 20px;
  height: 20px;
  background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,0.95) 50%);
  border-top-left-radius: 4px;
  box-shadow: -2px -2px 5px rgba(0,0,0,0.15);
  pointer-events: none;
  z-index: 2;
  transition: all 0.2s ease;
}
.boton-delegado:hover::before {
  width: 24px;
  height: 24px;
  box-shadow: -3px -3px 8px rgba(0,0,0,0.2);
}

<script>
(function(){
  // Intercepta click en "Habla con tu delegado"
  function handleDelegadoClick(e){
    var btn = e.target.closest && e.target.closest('.boton-delegado');
    if(!btn) return;
    
    var href = btn.getAttribute('href');
    if(!href) return;
    
    // Evitar navegación inmediata
    e.preventDefault();
    e.stopPropagation();
    
    var overlay = document.getElementById('bookTurnOverlay');
    if(!overlay){
      // Fallback: ir directo si no hay overlay
      window.location.href = href;
      return;
    }
    
    // Si ya está animando, no hacer nada
    if(overlay.classList.contains('active')) return;
    
    // Mostrar overlay y lanzar animación
    overlay.classList.add('active');
    
    // Pequeña vibración en móviles si está disponible
    if(navigator.vibrate){ try{ navigator.vibrate(30); }catch(_){} }
    
    // Después de la animación, navegar
    var duration = 1100; // debe coincidir con la duración CSS 1.15s
    
    setTimeout(function(){
      var target = btn.getAttribute('target');
      if(target === '_blank'){
        window.open(href, '_blank', 'noopener');
        // Ocultar overlay después de abrir nueva pestaña
        setTimeout(function(){
          overlay.classList.remove('active');
        }, 400);
      } else {
        window.location.href = href;
      }
    }, duration);
  }
  
  // Captura en fase de captura para adelantarse a React
  document.addEventListener('click', handleDelegadoClick, true);
})();
</script>

    document.body.appendChild(overlay);

    var frontInner = overlay.querySelector('.fpt-front-inner');
    var scrollY = window.scrollY || window.pageYOffset || 0;

    try {
      var source = document.getElementById('root');
      if(source){
        var clone = source.cloneNode(true);
        clone.querySelectorAll('#fluidPageTurn, script, style').forEach(function(el){ try{el.remove();}catch(_ ){} });
        clone.style.transform = 'translateY(-' + scrollY + 'px)';
        clone.style.width = '100%';
        clone.style.pointerEvents = 'none';
        clone.style.margin = '0';
        frontInner.appendChild(clone);
        // Forzar que el clon no tenga animaciones internas
        clone.querySelectorAll('*').forEach(function(el){
          el.style.animation = 'none';
          el.style.transition = 'none';
        });
      }
    } catch(e) {
      console.log('Clone error', e);
    }

    // Doble rAF para asegurar fluidez 60fps
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        overlay.classList.add('active');
      });
    });

    // Prefetch
    try {
      var link = document.createElement('link');
      link.rel = 'prefetch';
      link.href = href;
      document.head.appendChild(link);
    } catch(_ ){}

    var duration = 2500;
    var navigateAt = 1900;

    setTimeout(function(){
      if(target === '_blank'){
        window.open(href, '_blank', 'noopener');
        setTimeout(function(){
          overlay.classList.remove('active');
          setTimeout(function(){
            if(overlay.parentNode) overlay.parentNode.removeChild(overlay);
            isAnimating = false;
          }, 400);
        }, 500);
      } else {
        window.location.href = href;
      }
    }, navigateAt);

    setTimeout(function(){
      if(isAnimating && target !== '_blank' && overlay.classList.contains('active')){
        window.location.href = href;
      }
    }, duration + 600);
  }

  function handleClick(e){
    var btn = e.target.closest && e.target.closest('.boton-delegado');
    if(!btn) return;
    var href = btn.getAttribute('href');
    if(!href) return;
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();
    var target = btn.getAttribute('target');
    createFluidTurn(href, target);
  }

  document.addEventListener('click', handleClick, true);
})();
