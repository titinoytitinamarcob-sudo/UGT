body{overflow-x:hidden}.page{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;

<script>
const lines=[
['SerDUGT','big red'],
['es la plataforma de servicios<br>de nuestros <span class="red">afiliados y afiliadas.</span>','medium'],
['Todas las <span class="red">ventajas</span>, descuentos<br>y promociones a tu alcance.','medium'],
['Al alcance de tu <span class="red">móvil.</span>','big'],
['Accede estés donde estés y aprovecha<br>toda una oferta de servicios de <span class="red">ocio, tiempo libre y salud.</span>','normal'],
['Y todo ello con <span class="red">descuentos exclusivos</span> para ti.','medium'],
['Para que puedas disfrutar más de tu afiliación,<br>contamos con <span class="app">iBenefits</span>.','medium'],
['Una app donde podrás descubrir<br>tus <span class="red">ofertas, descuentos y promociones</span>.','medium']
];
let i=0;
function scrollToLine(el){
  const y=el.getBoundingClientRect().top + window.scrollY - (window.innerHeight*0.30);
  window.scrollTo({top:Math.max(0,y),behavior:'smooth'});
}
function next(){
 if(i<lines.length){
  const e=document.createElement('div');e.className='line '+lines[i][1];e.innerHTML=lines[i][0];
  document.getElementById('textArea').appendChild(e);
  document.getElementById('bar').style.width=((i+1)/lines.length*100)+'%';
  requestAnimationFrame(()=>scrollToLine(e));
  i++;
  setTimeout(next,2100);
 }else setTimeout(()=>{
   document.getElementById('final').style.display='block';
   document.getElementById('finalLogo').classList.add('visible');
   setTimeout(()=>scrollToLine(document.getElementById('final')),150);
 },900);
}
window.addEventListener('load',()=>setTimeout(next,600));
</script>
