<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tus delegados a un solo click...</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    overflow-x: hidden;
}

body {
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 100%;
    font-family: Arial, sans-serif;

    background:
        radial-gradient(
            circle at 50% 5%,
            #ff3030 0%,
            #ed0012 35%,
            #d60012 70%,
            #bd0010 100%
        );

    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
}


/* =====================================================
   CABECERA
===================================================== */

.cabecera {
    position: relative;
    width: 100%;
    max-width: 100%;
    text-align: center;
    padding: 20px 10px 25px;
    overflow: hidden;
}


/* =====================================================
   LOGO REAL UGT + FeSMC SEVILLA
===================================================== */

.marca {
    width: 100%;
    max-width: 520px;
    margin: 0 auto 5px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 18px;

    opacity: 0;

    transform:
        translateY(130px)
        scale(.65)
        rotateX(35deg);

    animation:
        logoEntrada
        1.9s
        cubic-bezier(.16,1,.3,1)
        forwards;

    animation-delay: 1.9s;

    perspective: 800px;
}


/* LOGO REAL UGT */

.logo-ugt-real {
    width: 150px;
    height: auto;
    max-width: 100%;

    display: block;
    object-fit: contain;

    filter:
        drop-shadow(0 8px 5px rgba(80,0,0,.55))
        drop-shadow(0 0 9px rgba(255,255,255,.7));
}


/* FeSMC Sevilla */

.fesmc-sevilla {
    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(25px, 5vw, 39px);

    font-weight: 700;

    line-height: 1.05;

    text-align: left;

    white-space: nowrap;

    text-shadow:
        0 3px 5px rgba(80,0,0,.55),
        0 0 8px rgba(255,255,255,.25);
}


/* BRILLO DEL LOGO */

.marca::before {
    content: "";

    position: absolute;

    width: 260px;
    height: 150px;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,.28),
            rgba(255,255,255,0) 70%
        );

    filter: blur(15px);

    opacity: .75;

    pointer-events: none;

    animation:
        brilloLogo
        2.5s
        ease-in-out
        infinite;

    animation-delay: 3.5s;
}


@keyframes brilloLogo {

    0%,100% {
        transform: scale(.9);
        opacity: .45;
    }

    50% {
        transform: scale(1.15);
        opacity: .9;
    }
}


/* ENTRADA DEL LOGO */

@keyframes logoEntrada {

    0% {
        opacity: 0;

        transform:
            translateY(130px)
            scale(.65)
            rotateX(35deg);
    }

    45% {
        opacity: .45;

        transform:
            translateY(25px)
            scale(1.08)
            rotateX(-8deg);
    }

    70% {
        opacity: 1;

        transform:
            translateY(-8px)
            scale(.96)
            rotateX(4deg);
    }

    86% {
        transform:
            translateY(3px)
            scale(1.02)
            rotateX(-2deg);
    }

    100% {
        opacity: 1;

        transform:
            translateY(0)
            scale(1)
            rotateX(0);
    }
}


/* =====================================================
   TÍTULO
===================================================== */

h1 {
    position: relative;

    margin: 0 auto;

    color: white;

    font-family:
        "Brushcut",
        "Brush Script MT",
        cursive;

    font-size:
        clamp(31px, 7.5vw, 56px);

    font-weight: normal;

    line-height: 1.12;

    max-width: 950px;

    text-shadow:
        0 3px 5px rgba(100,0,0,.45);
}


/* LETRAS */

.titulo-letra {
    display: inline-block;

    opacity: 0;

    transform:
        translateY(-230px)
        rotate(-14deg);

    animation:
        caerLetra
        .85s
        cubic-bezier(.18,.89,.32,1.28)
        forwards;

    animation-delay:
        calc(var(--i) * .075s);
}


@keyframes caerLetra {

    0% {
        opacity: 0;

        transform:
            translateY(-230px)
            rotate(-14deg);
    }

    55% {
        opacity: 1;

        transform:
            translateY(18px)
            rotate(5deg);
    }

    72% {
        transform:
            translateY(-8px)
            rotate(-2deg);
    }

    88% {
        transform:
            translateY(4px)
            rotate(1deg);
    }

    100% {
        opacity: 1;

        transform:
            translateY(0)
            rotate(0);
    }
}


/* SUBRAYADO */

h1::after {
    content: "";

    display: block;

    width: 0;
    height: 4px;

    margin: 13px auto 0;

    border-radius: 10px;

    background: white;

    box-shadow:
        0 0 8px rgba(255,255,255,.8);

    animation:
        subrayar
        .9s
        ease-out
        forwards;

    animation-delay: 3.35s;
}


@keyframes subrayar {

    from {
        width: 0;
    }

    to {
        width: min(570px, 86%);
    }
}


/* =====================================================
   CONTACTOS
===================================================== */

.contenedor {
    width: 100%;
    max-width: 760px;

    margin: 38px auto 0;

    padding: 0 18px 35px;

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 55px 35px;

    perspective: 1200px;

    overflow: visible;
}


/* CONTACTO */

.contacto {
    position: relative;

    text-decoration: none;

    text-align: center;

    background: transparent;

    border: none;

    padding: 0;

    color: black;

    min-width: 0;
    max-width: 100%;

    perspective: 1000px;
}


/* =====================================================
   FOTOS
===================================================== */

.contacto img {
    display: block;

    width:
        clamp(135px, 33vw, 195px);

    height:
        clamp(135px, 33vw, 195px);

    max-width: 100%;

    margin: 0 auto;

    object-fit: cover;
    object-position: center center;

    border-radius: 50%;

    border: 5px solid white;

    box-shadow:
        0 0 5px white,
        0 0 12px white,
        0 0 25px rgba(255,255,255,.95),
        0 8px 20px rgba(80,0,0,.45);

    opacity: 0;

    transform-style: preserve-3d;

    will-change:
        transform,
        opacity;
}


/* ENTRADA IZQUIERDA */

.contacto:nth-child(odd) img {

    transform:
        translateX(-650px)
        translateY(-180px)
        rotate(-720deg)
        scale(.25);

    animation:
        entrarIzquierda
        1.75s
        cubic-bezier(.16,1,.3,1)
        forwards;

    animation-delay:
        calc(3.7s + var(--orden) * .18s);
}


/* ENTRADA DERECHA */

.contacto:nth-child(even) img {

    transform:
        translateX(650px)
        translateY(-180px)
        rotate(720deg)
        scale(.25);

    animation:
        entrarDerecha
        1.75s
        cubic-bezier(.16,1,.3,1)
        forwards;

    animation-delay:
        calc(3.7s + var(--orden) * .18s);
}


/* =====================================================
   ANIMACIÓN IZQUIERDA
===================================================== */

@keyframes entrarIzquierda {

    0% {
        opacity: 0;

        transform:
            translateX(-650px)
            translateY(-180px)
            rotate(-720deg)
            scale(.25);
    }

    25% {
        opacity: 1;

        transform:
            translateX(-280px)
            translateY(70px)
            rotate(-430deg)
            scale(.65);
    }

    48% {
        transform:
            translateX(190px)
            translateY(-45px)
            rotate(320deg)
            scale(.82);
    }

    68% {
        transform:
            translateX(-80px)
            translateY(25px)
            rotate(-170deg)
            scale(.92);
    }

    84% {
        transform:
            translateX(30px)
            translateY(-10px)
            rotate(45deg)
            scale(1.04);
    }

    94% {
        transform:
            translateX(-8px)
            translateY(3px)
            rotate(-8deg)
            scale(.98);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0)
            translateY(0)
            rotate(0)
            scale(1);
    }
}


/* =====================================================
   ANIMACIÓN DERECHA
===================================================== */

@keyframes entrarDerecha {

    0% {
        opacity: 0;

        transform:
            translateX(650px)
            translateY(-180px)
            rotate(720deg)
            scale(.25);
    }

    25% {
        opacity: 1;

        transform:
            translateX(280px)
            translateY(70px)
            rotate(430deg)
            scale(.65);
    }

    48% {
        transform:
            translateX(-190px)
            translateY(-45px)
            rotate(-320deg)
            scale(.82);
    }

    68% {
        transform:
            translateX(80px)
            translateY(25px)
            rotate(170deg)
            scale(.92);
    }

    84% {
        transform:
            translateX(-30px)
            translateY(-10px)
            rotate(-45deg)
            scale(1.04);
    }

    94% {
        transform:
            translateX(8px)
            translateY(3px)
            rotate(8deg)
            scale(.98);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0)
            translateY(0)
            rotate(0)
            scale(1);
    }
}


/* =====================================================
   NOMBRES
===================================================== */

.nombre {
    display: block;

    margin-top: 15px;

    color: #080808;

    font-family:
        "Artifice SSK",
        "Artifice",
        "Brush Script MT",
        cursive;

    font-size:
        clamp(24px, 5vw, 34px);

    font-weight: 700;

    line-height: 1;

    letter-spacing: .5px;

    opacity: 0;

    transform:
        perspective(700px)
        translateZ(-500px)
        translateY(25px)
        rotateX(35deg)
        scale(.2);

    filter: blur(5px);

    animation:
        nombreIman
        .9s
        cubic-bezier(.16,1,.3,1)
        forwards;

    animation-delay:
        calc(5.65s + var(--orden) * .18s);

    text-shadow:
        0 2px 1px rgba(255,255,255,.3);
}


@keyframes nombreIman {

    0% {
        opacity: 0;

        transform:
            perspective(700px)
            translateZ(-500px)
            translateY(25px)
            rotateX(35deg)
            scale(.2);

        filter: blur(5px);
    }

    55% {
        opacity: 1;

        transform:
            perspective(700px)
            translateZ(60px)
            translateY(-4px)
            rotateX(-5deg)
            scale(1.12);

        filter: blur(0);
    }

    75% {
        transform:
            perspective(700px)
            translateZ(-10px)
            translateY(2px)
            rotateX(2deg)
            scale(.97);
    }

    90% {
        transform:
            perspective(700px)
            translateZ(12px)
            translateY(-1px)
            rotateX(0)
            scale(1.03);
    }

    100% {
        opacity: 1;

        transform:
            perspective(700px)
            translateZ(0)
            translateY(0)
            rotateX(0)
            scale(1);

        filter: blur(0);
    }
}


/* =====================================================
   TELÉFONO
===================================================== */

.telefono {
    display: block;

    margin-top: 7px;

    color: rgba(0,0,0,.7);

    font-family: Arial, sans-serif;

    font-size: 13px;

    opacity: 0;

    transform: translateY(15px);

    animation:
        telefonoEntrada
        .5s
        ease-out
        forwards;

    animation-delay:
        calc(6.1s + var(--orden) * .18s);
}


@keyframes telefonoEntrada {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =====================================================
   EFECTO CONTACTO
===================================================== */

.contacto:hover img {
    box-shadow:
        0 0 8px white,
        0 0 18px white,
        0 0 35px white,
        0 10px 25px rgba(70,0,0,.5);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}


/* =====================================================
   MÓVILES
===================================================== */

@media (max-width: 500px) {

    .cabecera {
        padding-top: 18px;
    }

    .marca {
        gap: 12px;
    }

    .logo-ugt-real {
        width: 125px;
    }

    .fesmc-sevilla {
        font-size: 25px;
    }

    .contenedor {
        gap: 48px 15px;
        padding: 0 10px 30px;
        width: 100%;
        max-width: 100%;
    }

    .contacto img {
        border-width: 4px;

        width: 145px;
        height: 145px;
    }

    .nombre {
        font-size: 25px;
    }
}


/* =====================================================
   SIN ANIMACIÓN
===================================================== */

@media (prefers-reduced-motion: reduce) {

    .titulo-letra,
    .marca,
    .contacto img,
    .nombre,
    .telefono,
    h1::after {

        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
    }
}

</style>

</head>

<script>

/* =====================================================
   ANIMACIÓN DEL TÍTULO
===================================================== */

const titulo =
    document.getElementById("titulo");

const texto =
    titulo.textContent.trim();

titulo.textContent = "";


[...texto].forEach(
    (letra, indice) => {

        const span =
            document.createElement("span");

        span.classList.add(
            "titulo-letra"
        );

        span.style.setProperty(
            "--i",
            indice
        );

        span.textContent =
            letra === " "
                ? "\u00A0"
                : letra;

        titulo.appendChild(
            span
        );

    }
);

</script>
