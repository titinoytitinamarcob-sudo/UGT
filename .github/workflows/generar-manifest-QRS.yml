name: Actualizar lista de imágenes QRS

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'QRS/**'
      - '.github/workflows/generar-manifest-QRS.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar QRS/imagenes.json
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          carpeta = Path("QRS")
          extensiones = {".png", ".jpg", ".jpeg"}

          import hashlib

          fotos = sorted(
              p for p in carpeta.iterdir()
              if p.is_file()
              and p.suffix.lower() in extensiones
              and p.name.lower() != "318778.png"
          )

          archivos = [p.name for p in fotos]

          # Huella del CONTENIDO de las fotos.
          # Así, si sustituyes una foto por otra con EXACTAMENTE el mismo
          # nombre, imagenes.json también cambia y GitHub Pages se vuelve a publicar.
          h = hashlib.sha256()
          for p in fotos:
              h.update(p.name.encode("utf-8"))
              h.update(b"\0")
              h.update(hashlib.sha256(p.read_bytes()).digest())
              h.update(b"\0")
          version = h.hexdigest()[:16]

          # El marcador no tiene extensión de imagen, por lo que el HTML lo ignora.
          manifest = [f"__manifest_version_{version}"] + archivos

          (carpeta / "imagenes.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print(f"Imágenes encontradas en QRS/: {len(archivos)}")
          print(f"Versión del contenido: {version}")
          for archivo in archivos:
              print(f" - {archivo}")
          PY

      - name: Guardar QRS/imagenes.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QRS/imagenes.json

          if git diff --cached --quiet; then
            echo "QRS/imagenes.json ya estaba actualizado."
          else
            git commit -m "Actualizar lista de imágenes QRS"
            git push
          fi
